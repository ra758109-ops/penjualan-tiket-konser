<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Pesanan - Admin KPOP TIX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
 
    <link rel="stylesheet" href="order-style.css">
</head>
<body class="bg-gray-100">

   
    <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden md:hidden"></div>

    <div class="flex min-h-screen">
        
  
        <aside id="sidebar" class="w-64 bg-slate-800 text-gray-200 fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 z-50 flex flex-col shadow-lg">
            
        
            <div class="p-5 bg-slate-900 text-white text-xl font-bold text-center">
                ADMIN KPOP TIX
            </div>

            <!-- Menu Navigasi -->
            <nav class="flex-1 space-y-2 p-4">
                <!-- Link ke Dashboard -->
                <a href="../DASHBOARD UTAMA/index.html" class="sidebar-link flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-300 hover:bg-slate-700 hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M2 10a8 8 0 018-8v8h8a8 8 0 11-16 0z" />
                        <path d="M12 2.252A8.014 8.014 0 0117.748 8H12V2.252z" />
                    </svg>
                    <span>Dashboard</span>
                </a>
                
                <!-- Link ke Manajemen Event -->
                <a href="../MANAJEMEN EVENT/admin-event.html" class="sidebar-link flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-300 hover:bg-slate-700 hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd" />
                    </svg>
                    <span>Manajemen Event</span>
                </a>
                
                <!-- Link Aktif: Manajemen Pesanan -->
                <a href="../MANAJEMEN ORDER/admin-order.html" class="sidebar-link active flex items-center gap-3 px-4 py-2.5 rounded-lg transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M2 6a2 2 0 012-2h12a2 2 0 012 2v2a2 2 0 01-2 2H4a2 2 0 01-2-2V6zm14 0v2a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2h12a2 2 0 012 2zm-4 8a2 2 0 012-2h2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2zm-4 0a2 2 0 012-2h2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2zm-4 0a2 2 0 012-2h2v2a2 2 0 01-2 2H4a2 2 0 01-2-2z" />
                    </svg>
                    <span>Pesanan & Penjualan</span>
                </a>
                
                <!-- Link ke Pengaturan -->
                <a href="../PENGATURAN WEBSITE/admin-setting.html" class="sidebar-link flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-300 hover:bg-slate-700 hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978.985.245 1.487 1.401.947 2.286-.835 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.835 2.942-.734 2.106-2.106a1.533 1.533 0 01-.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.835-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
                    </svg>
                    <span>Pengaturan Website</span>
                </a>
           
                <!-- Logout -->
                <a href="../LOGIN/login.html" class="sidebar-link flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-300 hover:bg-slate-700 hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd" />
                    </svg>
                    <span>Logout</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col">
            
            <!-- Top Bar (Header untuk Mobile) -->
            <header class="bg-white shadow-md md:hidden sticky top-0 z-30">
                <div class="flex justify-between items-center p-4">
                    <h1 class="text-xl font-bold text-slate-800">Manajemen Pesanan</h1>
                    <button id="mobileMenuButton" class="text-slate-800 hover:text-blue-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Area Konten Utama (Scrollable) -->
            <main class="flex-1 p-6 md:p-8 overflow-y-auto">
                
                <!-- KONTEN HALAMAN MANAJEMEN PESANAN MULAI DI SINI -->
                
                <!-- Header Halaman -->
                <h1 class="text-3xl font-bold text-gray-900 mb-6">Manajemen Penjualan & Pesanan</h1>

                <!-- Kontrol: Filter dan Export -->
                <div class="bg-white p-4 rounded-lg shadow-md mb-6">
                    <div class="flex flex-wrap items-center justify-between gap-4">
                        <!-- Search Input -->
                        <div class="flex-grow sm:flex-grow-0">
                            <input type="text" id="searchInput" placeholder="Cari Order ID, Nama, Email..." class="w-full sm:w-80 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        
                        <!-- Filter by Status -->
                        <div class="flex-grow sm:flex-grow-0">
                            <select id="statusFilter" class="w-full sm:w-auto px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="all">Semua Status</option>
                                <option value="Paid">Paid</option>
                                <option value="Pending">Pending</option>
                                <option value="Failed">Failed</option>
                            </select>
                        </div>

                        <!-- Export Button -->
                        <button id="exportCsvBtn" class="w-full sm:w-auto bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-lg flex items-center justify-center gap-2 transition duration-200">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                            </svg>
                            Export to CSV
                        </button>
                    </div>
                </div>

                <!-- Tabel Daftar Pesanan -->
                <div class="bg-white rounded-lg shadow-md overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Order ID</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Pembeli</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Event</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Total Harga</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="ordersTableBody" class="bg-white divide-y divide-gray-200">
                                <!-- Data akan di-render oleh JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <!-- KONTEN HALAMAN MANAJEMEN PESANAN SELESAI -->

            </main>
        </div>
    </div>

    <!-- Modal: Detail Pesanan -->
    <div id="detailModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 opacity-0 pointer-events-none">
        <div class="modal-content bg-white rounded-lg shadow-xl w-full max-w-lg mx-4 transform -translate-y-10">
            <div class="flex justify-between items-center border-b p-4">
                <h3 class="text-xl font-semibold">Detail Pesanan</h3>
                <button id="closeDetailModal" class="text-gray-400 hover:text-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div id="detailModalContent" class="p-6 space-y-4">
                <!-- Konten detail akan di-render oleh JavaScript -->
            </div>
        </div>
    </div>

    <!-- Modal: Edit Status Pesanan -->
    <div id="editModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 opacity-0 pointer-events-none">
        <div class="modal-content bg-white rounded-lg shadow-xl w-full max-w-md mx-4 transform -translate-y-10">
            <div class="flex justify-between items-center border-b p-4">
                <h3 class="text-xl font-semibold">Ubah Status Pesanan</h3>
                <button id="closeEditModal" class="text-gray-400 hover:text-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="p-6">
                <input type="hidden" id="editOrderId">
                <div class="space-y-4">
                    <div>
                        <label for="editStatusSelect" class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                        <select id="editStatusSelect" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="Pending">Pending</option>
                            <option value="Paid">Paid</option>
                            <option value="Failed">Failed</option>
                        </select>
                    </div>
                    <div class="flex justify-end gap-3">
                        <button id="cancelEditBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-2 px-4 rounded-lg transition duration-200">
                            Batal
                        </button>
                        <button id="saveStatusBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200">
                            Simpan
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript sekarang di file terpisah -->
    <script src="order.js"></script>
</body>
</html>
